{% extends 'base.html' %}
{% load static %}


{% block content %}
<div class="split left">
	<h2 align="center">Enter Text or Use Mic</h2>
	<br>
		<form action="" method="post" align="left">
		{% csrf_token %}
					<input type="text" name="sen" class="mytext" id="speechToText" placeholder="">
					<button type="button" name="button" class="mic" onclick="record()"><img src="{% static 'mic3.png' %}" height="32px" width="38px" /></button>
		  			&nbsp&nbsp&nbsp&nbsp
		  			<input type="submit" name="submit" class="submit">

		</form>
		<br>
		<table cellspacing="20px">
			<tr>
				<td class="td">The text that you entered is:</td>
				<td class="td">{{ text }}</td>
			</tr>
			<tr>
				<td class="td">Key words in sentence:</td>
				<td class="td">
				<ul class="td" id="list" align="center">
  					{% for word in words %}
    				<li id="{{ i }}" style="margin-right: 8px">{{ word }}</li>
  					{% endfor %}
				</ul>
			</td>
		</tr>
	</table></div>
  <div class="split right">
  <h2 align="center">Sign Language Animation</h2>

	<div style="text-align:center">	&nbsp&nbsp
  	<button class="submit" onclick="playPause()">Play/Pause</button>
  	<!--  LETS USE ONLY PLAY PAUSE BUTTON WITH 720 *420 ,IT FITS THE SCREEN ASHISH

  	<button onclick="makeBig()">Big</button>
  	<button onclick="makeSmall()">Small</button>
  	<button onclick="makeNormal()">Normal</button>-->


  	<video id="videoPlayer" width="600" height="350"  preload="auto" autoplay>
    	<source src="" type="video/mp4">
    Your browser does not support HTML5 video.
  	</video>
  	</div></div>


<script>
	//webkitSpeechRecognition api for speech to text conversion
	function record(){
		var recognition = new webkitSpeechRecognition();
		recognition.lang='en-IN';

		recognition.onresult = function(event){
			console.log(event)
			document.getElementById('speechToText').value = event.results[0][0].transcript;
		}
		recognition.start();
	 }

    const player = document.getElementById('videoPlayer');
    const words = Array.from(document.querySelectorAll('#list li'));
    let currentIndex = 0;
    let started = false;

    function playCurrent() {
        if (!words.length) return;
        words.forEach((word, index) => {
            word.style.color = index === currentIndex ? '#09edc7' : '#feda6a';
            word.style.fontSize = index === currentIndex ? 'xx-large' : '20px';
        });
        player.src = "/static/" + encodeURIComponent(words[currentIndex].textContent.trim()) + ".mp4";
        player.load();
        player.play().catch(() => { /* User can press Play to retry. */ });
    }

    player.addEventListener('ended', () => {
        currentIndex += 1;
        if (currentIndex < words.length) {
            playCurrent();
        } else {
            started = false;
            currentIndex = 0;
        }
    });

    function playPause() {
        if (!words.length) return;
        if (!started) {
            started = true;
            playCurrent();
        } else if (player.paused) {
            player.play().catch(() => {});
        } else {
            player.pause();
        }
    }

	</script>


{% endblock %}
